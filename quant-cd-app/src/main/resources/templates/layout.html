<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <title>quant-cd</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container flex-wrap">
        <a class="navbar-brand" href="/">quant-cd</a>
        <div class="navbar-nav flex-row flex-wrap">
            <a class="nav-link" href="/">总览</a>
            <span class="navbar-text text-info ms-3">数币</span>
            <a class="nav-link" th:href="@{/crypto}">现货</a>
            <a class="nav-link" th:href="@{/risk}">风控</a>
            <span class="navbar-text text-success ms-3">A股</span>
            <a class="nav-link" th:href="@{/ashare/data}">数据</a>
            <a class="nav-link" th:href="@{/ashare/screen}">筛选</a>
            <a class="nav-link" th:href="@{/ashare/backtest}">回测</a>
        </div>
        <form class="ms-auto" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-outline-light" type="submit">退出</button>
        </form>
    </div>
</nav>
<div th:fragment="alerts" class="container">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
</div>
<div th:fragment="progress" class="container mb-3">
    <div id="job" th:if="${job != null}" th:attr="data-id=${job.id},data-status=${job.status}">
        <p th:text="${job.message}"></p>
        <p th:text="${job.finished + ' / ' + job.total}"></p>
    </div>
    <script>
        var box = document.getElementById('job');
        if (box && box.getAttribute('data-status') === 'RUNNING') {
            var id = box.getAttribute('data-id');
            setInterval(function () {
                fetch('/ashare/sync/' + id).then(function (r) { return r.json(); }).then(function (job) {
                    box.querySelector('p').textContent = job.message + ' ' + job.finished + '/' + job.total;
                    if (job.status !== 'RUNNING') { location.reload(); }
                });
            }, 2000);
        }
    </script>
</div>
</body>
</html>
