<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
<div th:replace="layout :: nav"></div>
<div th:replace="layout :: alerts"></div>
<div th:replace="layout :: progress"></div>
<div class="container">
    <h1 class="h3">A股数据</h1>
    <p th:if="${!tokenConfigured}">未配置 Tushare Token</p>
    <form method="post" th:action="@{/ashare/sync/screen}" class="mb-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="submitToken" th:value="${screenToken}"/>
        <input type="hidden" name="back" value="data"/>
        <label class="form-label">指定代码，逗号分隔。留空表示全部上市股票。分红、年报、净利率、毛利率、ROE 和净现比已经记到最新完整年度的股票会跳过，只补缺的年份。</label>
        <textarea class="form-control mb-2" name="codes" rows="2"></textarea>
        <button class="btn btn-primary" type="submit" th:disabled="${!tokenConfigured}">同步筛选数据</button>
    </form>
    <form method="post" th:action="@{/ashare/sync/daily}" class="row g-2 mb-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="submitToken" th:value="${dailyToken}"/>
        <input type="hidden" name="back" value="data"/>
        <div class="col-md-3"><input class="form-control" name="tsCode" placeholder="600519.SH"/></div>
        <div class="col-md-3"><input class="form-control" name="start" placeholder="20240101"/></div>
        <div class="col-md-3"><input class="form-control" name="end" placeholder="20241231"/></div>
        <div class="col-md-3"><button class="btn btn-outline-primary" type="submit" th:disabled="${!tokenConfigured}">同步日线</button></div>
    </form>
    <form method="get" th:action="@{/ashare/data}" class="row g-2 mb-3">
        <div class="col-md-4"><input class="form-control" name="code" th:value="${code}" placeholder="查看日线"/></div>
        <div class="col-md-2"><button class="btn btn-outline-secondary" type="submit">查看</button></div>
    </form>
    <table class="table" th:if="${bars != null}">
        <thead><tr><th>日期</th><th>收盘</th><th>复权因子</th></tr></thead>
        <tbody>
        <tr th:each="bar : ${bars}">
            <td th:text="${bar.tradeDate}"></td>
            <td th:text="${bar.close}"></td>
            <td th:text="${bar.adjFactor}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
