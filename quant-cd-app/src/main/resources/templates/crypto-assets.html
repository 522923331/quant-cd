<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel(next)">
    <p th:if="${!configured}" class="text-muted mb-2">未配置币安密钥，余额暂不显示。币种仍可先添加。</p>
    <p th:if="${balanceError}" class="text-danger" th:text="${balanceError}"></p>
    <table class="table table-sm mb-3" th:if="${balances != null}">
        <thead><tr><th>币种</th><th>可用</th><th>冻结</th></tr></thead>
        <tbody>
        <tr th:each="row : ${balances}">
            <td th:text="${row.asset}"></td>
            <td th:text="${row.free}"></td>
            <td th:text="${row.locked}"></td>
        </tr>
        </tbody>
    </table>
    <p class="text-muted small">添加的币种会订阅现货行情。60 秒涨 5% 且 3 分钟涨 20% 时发急涨告警。填了买入价后，现货和理财合计还持有、价格达到买入价 1.3 倍时发浮盈告警。只发 Lark，不会自动下单。</p>
    <ul class="list-unstyled" th:if="${assets != null and !assets.isEmpty()}">
        <li th:each="row : ${assets}" class="d-flex align-items-center gap-2 mb-2 flex-wrap">
            <span th:text="${row.asset}"></span>
            <span class="text-muted small" th:if="${row.costPrice == null or row.costPrice.isEmpty()}">买入价未填</span>
            <span class="text-muted small" th:if="${row.costPrice != null and !row.costPrice.isEmpty()}"
                  th:text="'买入价 ' + ${row.costPrice}">买入价</span>
            <form method="post" th:action="@{/crypto/assets/cost}" class="d-inline-flex gap-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="asset" th:value="${row.asset}"/>
                <input type="hidden" name="next" th:value="${next}"/>
                <input class="form-control form-control-sm" name="cost" th:value="${row.costPrice}" placeholder="买入价" style="width:8rem"/>
                <button class="btn btn-sm btn-outline-primary" type="submit">保存</button>
            </form>
            <form method="post" th:action="@{/crypto/assets/cost/fetch}" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="asset" th:value="${row.asset}"/>
                <input type="hidden" name="next" th:value="${next}"/>
                <button class="btn btn-sm btn-outline-primary" type="submit">从成交读取</button>
            </form>
            <form method="post" th:action="@{/crypto/assets/remove}" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="asset" th:value="${row.asset}"/>
                <input type="hidden" name="next" th:value="${next}"/>
                <button class="btn btn-sm btn-outline-secondary" type="submit">移除</button>
            </form>
        </li>
    </ul>
    <form method="post" th:action="@{/crypto/assets}" class="row g-2">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="next" th:value="${next}"/>
        <div class="col-auto"><input class="form-control" name="asset" placeholder="例如 BTC" maxlength="20"/></div>
        <div class="col-auto"><button class="btn btn-outline-primary" type="submit">添加币种</button></div>
    </form>
</div>
</body>
</html>
