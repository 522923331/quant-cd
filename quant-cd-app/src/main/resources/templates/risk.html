<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
<div th:replace="layout :: nav"></div>
<div th:replace="layout :: alerts"></div>
<div class="container">
    <h1 class="h3">风控</h1>
    <form method="post" th:action="@{/risk}" class="row g-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="col-md-3">
            <label class="form-label">单笔最大金额</label>
            <input class="form-control" name="maxNotional" th:value="${risk.maxNotional}"/>
        </div>
        <div class="col-md-3">
            <label class="form-label">单笔最大数量</label>
            <input class="form-control" name="maxQty" th:value="${risk.maxQty}"/>
        </div>
        <div class="col-md-3">
            <label class="form-label">每分钟次数</label>
            <input class="form-control" name="maxOrdersPerMinute" th:value="${risk.maxOrdersPerMinute}"/>
        </div>
        <div class="col-md-3">
            <label class="form-label">最小间隔毫秒</label>
            <input class="form-control" name="minIntervalMs" th:value="${risk.minIntervalMs}"/>
        </div>
        <div class="col-12"><button class="btn btn-primary" type="submit">保存</button></div>
    </form>
</div>
</body>
</html>
